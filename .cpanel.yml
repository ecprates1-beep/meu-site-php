---
# Deploy para o document root do HostGator.
# Usa $HOME para não depender do caminho fixo da conta (/home1/davi6336).
deployment:
  tasks:
    - export D="$HOME/ahh.net.br"
    - if [ ! -d "$D" ]; then export D="$HOME/public_html/ahh.net.br"; fi
    - if [ ! -d "$D" ]; then export D="$HOME/public_html"; fi
    - echo "Deploy em $D"
    - /bin/cp -f index.php .htaccess "$D"
    - /bin/cp -Rf config includes pages public "$D"
